<html lang="zh-CN">
<head>

<title>🪷 莲之空棉花娃娃收集进度</title>
<style>
  :root {
    --bg: #faf5f7;
    --card-bg: #ffffff;
    --text: #2d1b24;
    --text-secondary: #6b4d5c;
    --accent: #e8739a;
    --accent-light: #fde4ec;
    --accent-gradient: linear-gradient(135deg, #e8739a, #f0a0be);
    --border: #f0d8e0;
    --shadow: 0 2px 12px rgba(232, 115, 154, 0.08);
    --shadow-hover: 0 4px 20px rgba(232, 115, 154, 0.15);
    --cherry-dark: #c44569;
    --cherry-light: #fdf0f4;
    --progress-bg: #f5e8ec;
    --divider: #f5e8ec;
    --tag-bg: #fde4ec;
    --tag-text: #c44569;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 60px;
  }
  .header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 36px 20px 30px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: "🪷";
    position: absolute;
    right: -20px;
    top: -30px;
    font-size: 140px;
    opacity: 0.12;
    transform: rotate(15deg);
  }
  .header h1 { font-size: 26px; letter-spacing: 1px; font-weight: 700; }
  .header .sub { margin-top: 8px; font-size: 13px; opacity: 0.92; }
  .header .sub small { display: block; margin-top: 4px; opacity: 0.75; font-size: 11px; }
  .lang-toggle {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,.22);
    border: 1px solid rgba(255,255,255,.55);
    color: #fff; font-size: 12px; font-weight: 600;
    padding: 5px 14px; border-radius: 99px; cursor: pointer;
    transition: background .2s;
    z-index: 3;
  }
  .lang-toggle:hover { background: rgba(255,255,255,.38); }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: -24px; position: relative; z-index: 2; padding: 0 16px; max-width: 1100px; margin-left: auto; margin-right: auto; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    text-align: center;
  }
  .stat-label { font-size: 12px; color: var(--text-secondary); }
  .stat-num { font-size: 26px; font-weight: 800; color: var(--accent); margin: 4px 0 2px; }
  .stat-num .small { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
  .stat-bar-track { height: 8px; background: var(--progress-bg); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .stat-bar-fill { height: 100%; background: var(--accent-gradient); border-radius: 99px; transition: width .5s ease; }
  .stat-pct { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

  .toolbar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    box-shadow: var(--shadow);
  }
  .search-box {
    flex: 1 1 180px;
    padding: 8px 12px;
    border: 1px solid #e0c8d0;
    border-radius: 10px;
    font-size: 13px;
    outline: none;
    background: var(--cherry-light);
    color: var(--text);
    min-width: 150px;
  }
  .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  select {
    padding: 8px 10px;
    border: 1px solid #e0c8d0;
    border-radius: 10px;
    font-size: 13px;
    background: #fff;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  .btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    background: var(--cherry-light);
    color: var(--cherry-dark);
    cursor: pointer;
    transition: all .2s;
    font-weight: 600;
  }
  .btn:hover { background: var(--accent-light); transform: translateY(-1px); }
  .btn.danger { background: #fdf0f4; color: #c0392b; }
  .btn.primary { background: var(--accent-gradient); color: #fff; border: none; }

  /* ===== bgm 风格列表行 ===== */
  .item-row {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-top: 10px;
    display: flex;
    overflow: hidden;
    transition: box-shadow .2s;
  }
  .item-row:hover { box-shadow: var(--shadow-hover); }
  .row-cover {
    width: 122px; min-width: 122px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cherry-light);
    cursor: zoom-in;
    position: relative;
  }
  .row-cover img {
    width: 102px; height: 102px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: block;
    transition: transform .2s;
  }
  .row-cover:hover img { transform: scale(1.08); }
  .row-info { flex: 1; min-width: 0; padding: 8px 12px; border-left: 1px solid var(--divider); }
  .row-title { font-size: 13px; font-weight: 700; line-height: 1.4; }
  .row-title .ja { font-weight: 400; font-size: 10.5px; color: var(--text-secondary); margin-left: 6px; }
  .row-tip { font-size: 11px; color: var(--text-secondary); margin-top: 2px; line-height: 1.65; }
  .row-tip b { color: var(--cherry-dark); }
  .tag {
    display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 99px;
    background: var(--tag-bg); color: var(--tag-text); font-weight: 600;
    margin-right: 3px; vertical-align: 1px;
  }
  .row-link { font-size: 11px; color: var(--accent); text-decoration: none; }
  .row-link:hover { text-decoration: underline; }
  .row-check {
    width: 218px; min-width: 218px;
    padding: 8px 10px;
    border-left: 1px solid var(--divider);
    background: #fffafb;
  }
  .rc-label { font-size: 11px; font-weight: 700; color: var(--cherry-dark); }
  .rc-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 5px; gap: 8px;
  }
  .rc-all {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; color: var(--accent); cursor: pointer;
    user-select: none; white-space: nowrap; flex-shrink: 0;
  }
  .rc-all input { accent-color: var(--accent); width: 13px; height: 13px; margin: 0; }
  .rc-ver {
    font-size: 11px; font-weight: 700;
    color: var(--cherry-dark);
    background: var(--accent-light);
    border-radius: 6px;
    padding: 2px 8px;
    margin: 6px 0 4px;
    display: inline-block;
  }
  .rc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; max-height: 118px; overflow-y: auto; }
  .rc-grid::-webkit-scrollbar { width: 5px; }
  .rc-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .role-check {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 12px; color: var(--text);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 6px;
    transition: background .15s;
  }
  .role-check:hover { background: var(--accent-light); }
  .role-check input { display: none; }
  .rc-box {
    width: 15px; height: 15px;
    border: 2px solid #d9a8bb;
    border-radius: 5px;
    background: #fff;
    position: relative;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all .15s;
  }
  .role-check input:checked + .rc-box {
    background: var(--accent-gradient);
    border-color: var(--accent);
  }
  .role-check input:checked + .rc-box::after {
    content: '✓';
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rc-name {
    flex: 1; min-width: 0;
    line-height: 1.35;
    word-break: break-word;
    overflow-wrap: break-word;
  }
  .role-check.checked .rc-name { color: var(--cherry-dark); font-weight: 700; }
  .rc-empty {
    font-size: 11.5px; color: var(--text-secondary);
    padding: 12px 4px; text-align: center; line-height: 1.7;
  }

  /* lightbox 大图 */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(45, 27, 36, 0.82);
    z-index: 999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    padding: 24px;
  }
  #lightbox.show { opacity: 1; pointer-events: auto; }
  #lightbox img {
    max-width: 90vw; max-height: 86vh;
    border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,.45);
    background: #fff;
  }
  #lightbox .lb-close {
    position: absolute; top: 18px; right: 22px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.4);
    color: #fff; font-size: 20px; line-height: 1;
    cursor: pointer;
    transition: background .2s;
  }
  #lightbox .lb-close:hover { background: rgba(255,255,255,.3); }
  #lightbox .lb-name {
    position: absolute; left: 0; right: 0; bottom: 18px;
    text-align: center; color: #fff; font-size: 13px;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
    padding: 0 30px;
  }

  .empty-tip { text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 14px; }
  .empty-tip .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

  .footer {
    text-align: center; color: var(--text-secondary); font-size: 11px;
    padding: 26px 16px 12px; line-height: 1.8;
  }
  .footer .f-brand {
    font-size: 13.5px; font-weight: 700; color: var(--cherry-dark);
    margin-bottom: 4px; letter-spacing: .4px;
  }
  .footer .f-info { font-size: 11px; }
  .footer .f-info a { color: var(--accent); text-decoration: none; }
  .footer .f-ack {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed var(--divider);
    font-size: 10px; opacity: .85;
  }
  .footer .f-copy { margin-top: 6px; font-size: 9.5px; opacity: .7; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; font-size: 13px;
    padding: 10px 22px; border-radius: 99px; opacity: 0; transition: all .3s;
    pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 768px) {

    .container { padding: 0 10px; }
    .stats { gap: 10px; padding: 0 10px; }
    .stat-card { padding: 12px 8px; }
    .stat-num { font-size: 22px; }

    .toolbar { gap: 8px; padding: 10px; }
    .toolbar .search-box { flex-basis: 100%; }
    .toolbar select { flex: 1 1 auto; min-width: 0; }
    .toolbar .btn { flex: 1 1 auto; padding: 8px 8px; font-size: 12px; }

    .item-row { flex-wrap: wrap; }
    .row-cover { width: 108px; min-width: 108px; padding: 8px; }

    .row-info { flex: 1; min-width: 0; padding: 8px 10px; }

    .rc-grid { grid-template-columns: repeat(3, 1fr); max-height: none; }

    .rc-grid { grid-template-columns: repeat(2, 1fr); }
    .row-title .ja { display: none; }
  }
</style>
</head>

    .filter(Boolean).join('　');
  const coverName = grp.nameJa || it.nameJa;
  const cover = `<div class="row-cover" data-img="${it.img}" data-name="${coverName.replace(/"/g, '&quot;')}" title="${coverName}"><img loading="lazy" src="${it.img}" alt="${coverName}"></div>`;
  return `
  <div class="item-row" data-series="${it.series.replace(/"/g, '&quot;')}">
    ${cover}
    <div class="row-info">
      <div class="row-title">${main}</div>
      <div class="row-tip">${info1}</div>
      ${info2 ? `<div class="row-tip">${info2}</div>` : ''}
      <a class="row-link" href="${it.url}" target="_blank">${T('off')}</a>
    </div>
    <div class="row-check">
      ${rowTotal ? `<div class="rc-head"><div class="rc-label">${T('checkedLabel').replace('{c}', rowChecked).replace('{t}', rowTotal)}</div><label class="rc-all" title="${T('selectAll')}"><input type="checkbox" class="rc-all-box" data-series="${it.series.replace(/"/g, '&quot;')}" data-ver="${ver.replace(/"/g, '&quot;')}"><span>${T('selectAll')}</span></label></div>` : ''}
      ${rowTotal ? `<div class="rc-grid">${rowRoles.map(r => roleCheckHtml(it.series, ver, r)).join('')}</div>` : `<div class="rc-empty">${T('noRoles')}</div>`}
    </div>
  </div>`;
}

function render() {
  const kw = $('#search').value.trim().toLowerCase();
  const fRole = $('#f-role').value;

  // 按 系列×版本×款式×发售批次 合并（同批仅角色不同的商品合并成一行）
  const groupMap = {};
  DATA.items.forEach(it => {
    const key = it.series + '|' + (it.version || '') + '|' + it.style + '|' + it.launch;
    if (!groupMap[key]) {
      groupMap[key] = {
        series: it.series,
        version: it.version || '通常版',
        style: it.style,
        nameZh: it.style,
        nameJa: it.styleJa || it.style,
        batch: it.launch,
        items: [],
        chars: [],
        minLaunch: it.launch,
        maxLaunch: it.launch,
        minSort: it.sortKey,
      };
    }
    const g = groupMap[key];
    g.items.push(it);
    if (it.chars) it.chars.forEach(r => { if (!g.chars.includes(r)) g.chars.push(r); });
    if (it.launch < g.minLaunch) g.minLaunch = it.launch;
    if (it.launch > g.maxLaunch) g.maxLaunch = it.launch;
    if (it.sortKey < g.minSort) g.minSort = it.sortKey;
  });

  const matched = Object.values(groupMap)
    .filter(g => {
      if (fRole && !g.chars.includes(fRole)) return false;
      if (kw) {
        const hay = (g.nameZh + g.nameJa + g.series + g.chars.join('') + g.items.map(i => i.nameJa).join('')).toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    })
    .sort((a, b) => {
      const k = a.minSort < b.minSort ? -1 : a.minSort > b.minSort ? 1 : 0;
      return sortAsc ? k : -k;
    });

  $('#item-list').innerHTML = matched.map(itemRowHtml).join('');
  $('#empty-text').textContent = T('empty');
  $('#empty').style.display = matched.length ? 'none' : 'block';
}

function updateStats() {
  let total = 0, checked = 0, fullSeries = 0;
  seriesData.forEach(sd => {
    const n = allChecks(sd).length;
    total += n;
    checked += totalCheckCount(sd);
    if (n && totalCheckCount(sd) === n) fullSeries++;
  });
  const pct = total ? Math.round(checked / total * 100) : 0;
  $('#st-overall').innerHTML = pct + '<span class="small">%</span>';
  $('#st-overall-bar').style.width = pct + '%';
  $('#st-overall-pct').textContent = checked + ' / ' + total + ' 项';
  $('#st-checked').textContent = checked;
  $('#st-full-series').textContent = fullSeries;
  $('#st-series-total').textContent = seriesData.length;
  $('#st-items').textContent = DATA.items.length;
}

/* 应用语言：更新静态文案并重绘 */
function applyLang() {
  document.title = T('title');
  $('#site-title').textContent = T('title');
  $('#site-sub').textContent = T('subtitle');
  $('#site-note').textContent = T('note');
  $('#lang-toggle').textContent = T('langBtn');
  $('#st-lbl-overall').textContent = T('s_overall');
  $('#st-lbl-checked').textContent = T('s_checked');
  $('#st-lbl-full').textContent = T('s_full');
  $('#st-lbl-items').textContent = T('s_items');
  $('#st-sub-checked').textContent = T('s_checkedSub');
  $('#st-sub-full').textContent = T('s_fullSub');
  $('#st-sub-items').textContent = T('s_itemsSub');
  $('#search').placeholder = T('searchPh');
  const sort = $('#sort');
  sort.options[0].textContent = T('sortAsc');
  sort.options[1].textContent = T('sortDesc');
  const roleSel = $('#f-role');
  roleSel.options[0].textContent = T('allRole');
  DATA.roles.forEach((r, i) => {
    roleSel.options[i + 1].textContent = lang === 'ja' ? r.ja : r.cn + '（' + r.ja + '）';
  });
  $('#footer-brand').textContent = T('footerBrand');
  $('#footer-src').innerHTML = T('footerSrc')
    .replace('Love Live! 蓮ノ空女学院 公式サイト GOODS', '<a href="https://www.lovelive-anime.jp/hasunosora/goods/" target="_blank">Love Live! 蓮ノ空女学院 公式サイト GOODS</a>')
    .replace('Love Live! 莲之空女学院 公式官网 GOODS', '<a href="https://www.lovelive-anime.jp/hasunosora/goods/" target="_blank">Love Live! 莲之空女学院 公式官网 GOODS</a>');
  $('#footer-author').innerHTML = T('footerAuthor');
  $('#footer-ack').textContent = T('footerAck');
  $('#footer-copy').textContent = T('footerCopy');
  render();
  updateStats();
}

/* ========== 事件 ========== */
/* 图片点击放大（lightbox） */
function openLightbox(img, name) {
  $('#lb-img').src = img;
  $('#lb-name').textContent = name;
  $('#lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  $('#lightbox').classList.remove('show');
  document.body.style.overflow = '';
}
$('#item-list').addEventListener('click', e => {
  const cover = e.target.closest('.row-cover');
  if (cover) {
    const img = cover.querySelector('img');
    if (img && img.src) openLightbox(img.src, cover.dataset.name || '');
    return;
  }
});
$('#lightbox').addEventListener('click', e => {
  if (e.target === $('#lightbox') || e.target.closest('.lb-close')) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

$('#item-list').addEventListener('change', e => {
  const cb = e.target;
  // 全选：勾选/取消该行全部角色
  if (cb.classList.contains('rc-all-box')) {
    const row = cb.closest('.item-row');
    const on = cb.checked;
    row.querySelectorAll('.rc-grid input[type="checkbox"]').forEach(rb => {
      if (rb.checked !== on) setChecked(rb.dataset.series, rb.dataset.ver, rb.dataset.role, on);
    });
    render();
    updateStats();
    toast(on ? T('selectAllDone') : T('unselectAllDone'));
    return;
  }
  if (!cb.matches('input[type="checkbox"]')) return;
  const series = cb.dataset.series;
  const ver = cb.dataset.ver;
  const role = cb.dataset.role;
  setChecked(series, ver, role, cb.checked);
  render();
  updateStats();
  toast(cb.checked ? T('checked').replace('{r}', roleName(role)) : T('unchecked').replace('{r}', roleName(role)));
});

$('#search').addEventListener('input', render);
$('#f-role').addEventListener('change', render);
$('#sort').addEventListener('change', e => {
  sortAsc = e.target.value !== 'desc';
  render();
});
$('#lang-toggle').addEventListener('click', () => {
  lang = lang === 'zh' ? 'ja' : 'zh';
  localStorage.setItem('hasu-nui-lang', lang);
  applyLang();
});

$('#btn-reset').addEventListener('click', () => {
  if (!confirm(T('resetConfirm'))) return;
  state = {};
  saveState();
  render();
  updateStats();
  toast(T('cleared'));
});

$('#btn-image').addEventListener('click', () => {
  const W = 1000, H = 420;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#e8739a'); grad.addColorStop(1, '#f0a0be');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillRect(0, 100, W, H - 100);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 34px "PingFang SC","Microsoft YaHei"';
  ctx.fillText(T('title'), W / 2, 60);
  ctx.font = '18px sans-serif';
  ctx.fillText(new Date().toLocaleDateString('zh-CN'), W / 2, 88);
  let total = 0, checked = 0;
  seriesData.forEach(sd => { const n = allChecks(sd).length; total += n; checked += totalCheckCount(sd); });
  const pct = Math.round(checked / total * 100);
  ctx.fillStyle = '#2d1b24';
  ctx.font = 'bold 58px sans-serif';
  ctx.fillText(pct + '%', W / 2, 195);
  ctx.font = '15px "PingFang SC","Microsoft YaHei"';
  ctx.fillStyle = '#6b4d5c';
  ctx.fillText(T('s_checked') + ' ' + checked + ' / ' + total, W / 2, 220);
  ctx.fillStyle = '#f5e8ec';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(150, 240, 700, 16, 8) : ctx.rect(150, 240, 700, 16);
  ctx.fill();
  ctx.fillStyle = '#e8739a';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(150, 240, 700 * pct / 100, 16, 8) : ctx.rect(150, 240, 700 * pct / 100, 16);
  ctx.fill();
  let y = 285;
  ctx.textAlign = 'left';
  ctx.font = '13px "PingFang SC","Microsoft YaHei"';
  seriesData.forEach(sd => {
    const n = allChecks(sd).length;
    if (!n) return;
    const c = totalCheckCount(sd);
    const w = 300 * c / n;
    ctx.fillStyle = '#6b4d5c';
    ctx.fillText(sd.series.slice(0, 22) + '  ' + c + '/' + n, 110, y + 9);
    ctx.fillStyle = '#f5e8ec';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(430, y, 300, 12, 6) : ctx.rect(430, y, 300, 12);
    ctx.fill();
    ctx.fillStyle = '#e8739a';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(430, y, w, 12, 6) : ctx.rect(430, y, w, 12);
    ctx.fill();
    y += 26;
  });
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '莲之空棉花娃娃收集进度_' + new Date().toISOString().slice(0, 10) + '.png';
    a.click();
    toast(T('imgDone'));
  });
});

/* ========== 初始化 ========== */
applyLang();
</script>
</body>
</html>
